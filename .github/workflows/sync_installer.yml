name: Sync Installer to Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download PCDeck-Setup.exe from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0 -p "PCDeck-Setup.exe" -D website
          ls -lh website/PCDeck-Setup.exe

      - name: Commit and Push static installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/PCDeck-Setup.exe
          git commit -m "feat: publish static PCDeck-Setup.exe to website for direct 200 OK hosting [skip ci]" || exit 0
          git push origin main
