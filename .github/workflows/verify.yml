name: PCDeck Continuous Verification Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Audit Invariants & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Deterministic Invariant Auditor
        run: python tools/audit_repo.py

      - name: 2. Run Website Responsiveness & Integrity Auditor
        run: python tools/verify_website.py

      - name: 3. Run Automated Regression Test Suite
        timeout-minutes: 3
        run: |
          python -m pytest tests/ -v --timeout=30 -s
